if(tab=='data'){const L=(k,l,t='text')=>`<label class=w2>${l}<input type=${t} data-s=1 data-k=${k} value="${esc(S[k])}"></label>`;p=`<div class=g>${L('date','Tanggal hitung mundur','datetime-local')}${L('map','Link Google Maps (https://...)')}${L('link','Link undangan untuk WhatsApp')}<button data-a=mus>Tambah musik</button><button data-a=musx>Hapus musik</button></div>`}
if(tab=='list')p=ALL().map(e=>`<div class=li><span data-a=pick:${e.id}>${e.text!=null?esc(e.text.slice(0,28)):e.type=='img'?'Gambar':'Hitung mundur'}</span><input type=checkbox data-a=vis:${e.id} ${e.vis?'checked':''}></div>`).join('');
ui.innerHTML=`<div id=top><button data-a=exit>✕ Keluar</button><button class=pr data-a=save>Simpan & Bagikan</button><button data-a=wa>WhatsApp</button></div><div class=pn><div class=tabs>${tabs}</div>${p}</div><input type=file id=f hidden>`}
function setEd(v){ed=v;document.body.classList.toggle('ed',v);if(v){cov.style.display='none';au.pause();UI()}else{cov.style.display='none';cov.classList.remove('sm');ui.innerHTML=fabHTML()+'<input type=file id=f hidden>'}render();if(!v)observe()}
const mv=(a)=>{const[x,y]=a.split(',').map(Number);sel.x+=x;sel.y+=y;render()};
async function act(a){const[k,v]=[a.split(':')[0],a.slice(a.indexOf(':')+1)];
if(k=='open')return open_();if(k=='edit'){cov.style.display='none';return setEd(true)}if(k=='exit')return setEd(false);
if(k=='mute'){au.paused?au.play():au.pause();return muteBtn()}
if(k=='tab'){tab=v;return UI()}
if(k=='addT'){const o=T('Teks baru',scrollY/(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1)+200,24,'Great Vibes');S.els.push(o);sel=o;tab='el'}
if(k=='addI'||k=='addD'){const src=await img(k=='addD'?700:1100),o=I(scrollY/(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1)+200,k=='addD'?120:200,k=='addD'?'free':'box');o.src=src;S.els.push(o);sel=o;tab='el'}
if(k=='addP')S.pages++;if(k=='delP'&&S.pages>1)S.pages--;
if(k=='rep'){sel.src=await img(1100)}
if(k=='del'){S.els=S.els.filter(e=>e!=sel);S.cels=S.cels.filter(e=>e!=sel);sel=null}if(k=='dup'){const c={...sel,id:id(),x:sel.x+12,y:sel.y+12};(S.cels.includes(sel)?S.cels:S.els).push(c);sel=c}
if(k=='addCT'){const o=T('Teks baru',300,26,'Great Vibes');S.cels.push(o);sel=o;tab='el'}
if(k=='addCI'){const o=I(300,120,'free');o.src=await img(700);S.cels.push(o);sel=o;tab='el'}
if(k=='seal'){S.seal=await img(400)}if(k=='sealx')S.seal=SEAL;if(k=='cimg'){S.cimg=await img(900)}if(k=='cimgx')S.cimg='';
if(k=='rp'){cov.classList.remove('op','sm');cov.style.display='block';setTimeout(()=>cov.classList.add('op'),500);setTimeout(()=>cov.classList.remove('op'),3600);return}
if(k=='mv')return mv(v);if(k=='prev'){const e=$('.el.sel .in');e.classList.add('pre');void e.offsetWidth;e.classList.remove('pre');return}
if(k=='th'){S.theme=v}if(k=='fall'){S.els.forEach(e=>{if(e.type=='text'||e.type=='map')e.font=$('#fa').value})}
if(k=='pbg'){S.pbg[$('#pgs').value]=await img(1000)}if(k=='pbgx'){delete S.pbg[$('#pgs').value]}
if(k=='mus'){const f=$('#f');f.accept='audio/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{S.music=r.result;toast('Musik ditambahkan')};r.readAsDataURL(f.files[0]);f.value=''};f.click();return}
if(k=='musx')S.music='';
if(k=='pick'){sel=ALL().find(e=>e.id==v);tab='el'}if(k=='vis'){const e=ALL().find(e=>e.id==v);e.vis=e.vis?0:1;return render()}
if(k=='wa')return window.open('https://wa.me/?text='+encodeURIComponent('Kami mengundang Anda ke pernikahan kami: '+(S.link||location.href)));
if(k=='save')return save();
render();UI()}
async function save(){try{const a=await claude.use('artifact');if(!a)return toast('Penyimpanan tidak tersedia');toast('Menyimpan...');const c=document.documentElement.cloneNode(true);['#app','#cov','#ui'].forEach(s=>c.querySelector(s).innerHTML='');c.removeAttribute('style');c.querySelector('body').removeAttribute('class');c.querySelector('#cov').removeAttribute('style');c.querySelector('#S').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await a.publish('<!DOCTYPE html>'+c.outerHTML)}catch(e){toast('Gagal menyimpan')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.type!='checkbox'){e.preventDefault();act(t.dataset.a)}else if(ed&&e.target.closest('.mp a'))e.preventDefault()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a&&t.type=='checkbox')act(t.dataset.a)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const v=t.type=='checkbox'?(t.checked?1:0):t.type=='range'?+t.value:t.value;(t.dataset.s?S:sel)[k]=v;render()});
function pd(e){if(!ed)return;const el=e.target.closest('.el');if(!el)return;sel=ALL().find(o=>o.id==el.dataset.id);if(!sel)return;st={x:e.clientX,y:e.clientY,ox:sel.x,oy:sel.y};drag=el;el.setPointerCapture(e.pointerId);document.querySelectorAll('.el.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');tab='el';UI()}
function pm(e){if(!drag)return;const u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))*(cov.contains(drag)?.6:1);sel.x=st.ox+(e.clientX-st.x)/u;sel.y=st.oy+(e.clientY-st.y)/u;drag.style.left=`calc(var(--u)*${sel.x})`;drag.style.top=`calc(var(--u)*${sel.y})`}
[app,cov].forEach(x=>{x.addEventListener('pointerdown',pd);x.addEventListener('pointermove',pm);x.addEventListener('pointerup',()=>drag=null)});
fit();addEventListener('resize',fit);render();cover();ui.innerHTML=fabHTML()+'<input type=file id=f hidden>';
(async()=>{try{const u=await claude.use('user');if(u&&u.canEdit()){can=true;ui.innerHTML=fabHTML()+'<input type=file id=f hidden>'}}catch(e){}})();
</script></body></html>
